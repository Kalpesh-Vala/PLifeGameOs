<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Life OS</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: #0a0a0a;
        color: #ededed;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        text-align: center;
        padding: 2rem;
      }
      .badge {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #a78bfa33, #22c55e33);
      }
      h1 {
        font-size: 1.25rem;
        margin: 0;
      }
      p {
        color: #a1a1a1;
        max-width: 22rem;
        margin: 0;
        font-size: 0.9rem;
      }
      button {
        margin-top: 0.5rem;
        padding: 0.55rem 1.1rem;
        border-radius: 0.6rem;
        border: 1px solid #2a2a2a;
        background: #ededed;
        color: #0a0a0a;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="badge">✦</div>
    <h1>You're offline</h1>
    <p>
      Life OS can't reach the network right now. Pages and data you've already
      opened are still available — reconnect to sync everything.
    </p>
    <button onclick="location.reload()">Try again</button>
  </body>
</html>
